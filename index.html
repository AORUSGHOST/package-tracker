<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FedEx Tracker Cloud</title>
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkZlZEV4IFRyYWNrZXIiLAogICJzaG9ydF9uYW1lIjogIkZlZEV4VHJhY2siLAogICJzdGFydF91cmwiOiAiLi8iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwZDBmMTciLAogICJ0aGVtZV9jb2xvciI6ICI2ZDI4ZDkiLAogICJpY29ucyI6IFtdCn0=">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0d0f17; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-sidebar { background-color: #1a1c29; }
        .bg-card { background-color: #181b2a; }
        .bg-card-hover:hover { background-color: #22263a; }
        .border-custom { border-color: #2a2e45; }
        .bg-purple-accent { background-color: #6d28d9; }
        .bg-purple-accent:hover { background-color: #5b21b6; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #11131f; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2a2e45; border-radius: 3px; }
        input, textarea { -webkit-user-select: text; user-select: text; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden select-none">

    <!-- Sidebar / Navigation -->
    <aside class="w-full md:w-64 bg-sidebar border-b md:border-r border-custom flex flex-row md:flex-col justify-between p-4 shrink-0">
        <div>
            <div class="flex items-center space-x-3 mb-0 md:mb-8 px-2">
                <div class="bg-purple-accent p-2.5 rounded-xl text-white">
                    <i class="fa-solid fa-box-archive text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-none">Fed<span class="text-orange-500">Ex</span></h1>
                    <span class="text-xs text-gray-400">Cloud Sync Tracker</span>
                </div>
            </div>
            <nav class="hidden md:block space-y-1">
                <button onclick="toggleModal('addModal')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-purple-accent text-white font-medium shadow-lg shadow-purple-900/30">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Shipment</span>
                </button>
                <button onclick="requestNotificationPermission()" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-400 hover:text-white hover:bg-card-hover transition">
                    <i class="fa-solid fa-bell"></i>
                    <span>Enable Alerts</span>
                </button>
            </nav>
        </div>
        <div class="flex items-center space-x-2 md:space-x-0">
            <button onclick="toggleModal('addModal')" class="md:hidden bg-purple-accent text-white px-3 py-2 rounded-xl text-xs font-medium">+ Add</button>
            <button onclick="requestNotificationPermission()" class="md:hidden bg-card border border-custom text-gray-300 px-3 py-2 rounded-xl text-xs font-medium"><i class="fa-solid fa-bell"></i></button>
        </div>
    </aside>

    <!-- Main Content Panel -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#0f111d] overflow-hidden">
        <header class="h-16 border-b border-custom flex items-center justify-between px-6 shrink-0">
            <div>
                <h2 class="text-xl font-bold text-white">My Shipments</h2>
                <p class="text-xs text-gray-400">Cloud synced live on PC & iPhone</p>
            </div>
            <div class="flex items-center space-x-3">
                <div class="relative hidden sm:block">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-500 text-sm"></i>
                    <input type="text" id="searchInput" oninput="filterShipments()" placeholder="Search..." class="bg-card border border-custom rounded-xl pl-9 pr-4 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 w-48 lg:w-64">
                </div>
            </div>
        </header>
        
        <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 lg:p-6">
                <div id="shipmentList" class="space-y-3"></div>
            </div>
            <div class="w-full lg:w-96 border-t lg:border-t-0 lg:border-l border-custom bg-sidebar p-6 overflow-y-auto custom-scrollbar shrink-0">
                <div id="detailView"></div>
            </div>
        </div>
    </main>

    <!-- Add Shipment Modal -->
    <div id="addModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-card border border-custom rounded-2xl w-full max-w-md p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Add New Shipment</h3>
                <button onclick="toggleModal('addModal')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Shipment Name</label>
                    <input type="text" id="addName" placeholder="e.g. iPhone Order" class="w-full bg-[#11131f] border border-custom rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">FedEx Tracking Number(s)</label>
                    <textarea id="addTracking" rows="3" placeholder="Enter tracking numbers (comma or newline separated)" class="w-full bg-[#11131f] border border-custom rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500"></textarea>
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="toggleModal('addModal')" class="px-4 py-2 rounded-xl text-sm text-gray-400 hover:text-white">Cancel</button>
                <button onclick="addShipment()" class="bg-purple-accent text-white px-4 py-2 rounded-xl text-sm font-medium">Save to Cloud</button>
            </div>
        </div>
    </div>

    <script>
        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA7U8mOSPE-HyZTcDrPIMtjVGgsmO-mt0s",
            authDomain: "package-tracker-a84eb.firebaseapp.com",
            projectId: "package-tracker-a84eb",
            storageBucket: "package-tracker-a84eb.firebasestorage.app",
            messagingSenderId: "199245706754",
            appId: "1:199245706754:web:40501713c0238e7144591b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let shipments = [];
        let selectedId = null;

        // Register Service Worker for PWA & Notifications
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                console.log('Service Worker Registered');
            });
        }

        function requestNotificationPermission() {
            if ('Notification' in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        alert('Push notifications enabled for status updates!');
                    } else {
                        alert('Notification permission denied or blocked.');
                    }
                });
            } else {
                alert('Notifications not supported on this browser.');
            }
        }

        // Realtime Listener across all PC & Phone devices
        db.collection('shipments').onSnapshot(snapshot => {
            shipments = [];
            snapshot.forEach(doc => {
                shipments.push({ id: doc.id, ...doc.data() });
            });
            renderList();
        });

        function renderList(data = shipments) {
            const container = document.getElementById('shipmentList');
            container.innerHTML = '';
            if (data.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-10 text-sm">No tracking numbers saved yet. Click "+ Add Shipment" to start!</p>`;
                renderDetails();
                return;
            }
            if (!selectedId || !shipments.find(s => s.id === selectedId)) {
                selectedId = data[0].id;
            }
            data.forEach(item => {
                const isSelected = item.id === selectedId;
                const trackingClean = (item.tracking || '').replace(/\s+/g, '');
                container.innerHTML += `
                    <div onclick="selectShipment('${item.id}')" class="p-4 rounded-xl border border-custom ${isSelected ? 'bg-purple-900/20 border-purple-500' : 'bg-card bg-card-hover'} cursor-pointer transition flex items-center justify-between">
                        <div>
                            <h4 class="font-bold text-white text-sm">${item.name}</h4>
                            <p class="text-xs font-mono text-purple-400 mt-0.5">${trackingClean}</p>
                            <span class="inline-block mt-2 text-[10px] bg-green-500/10 text-green-400 border border-green-500/20 px-2 py-0.5 rounded-full">${item.status || 'In Transit'}</span>
                        </div>
                        <button onclick="deleteShipment(event, '${item.id}')" class="text-gray-500 hover:text-red-400 px-2 py-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });
            renderDetails();
        }

        function selectShipment(id) {
            selectedId = id;
            renderList();
        }

        function renderDetails() {
            const item = shipments.find(s => s.id === selectedId);
            const container = document.getElementById('detailView');
            if (!item) {
                container.innerHTML = '<p class="text-gray-500 text-sm text-center py-10">Select a shipment to view details</p>';
                return;
            }
            const trackingClean = (item.tracking || '').replace(/\s+/g, '');
            container.innerHTML = `
                <div>
                    <h3 class="font-bold text-lg text-white">${item.name}</h3>
                    <p class="text-xs font-mono text-purple-400 mb-6">${trackingClean}</p>
                    <div class="bg-card p-4 rounded-xl border border-custom mb-6">
                        <span class="text-xs text-gray-400 block mb-1">Status</span>
                        <span class="text-base font-bold text-white">${item.status || 'In Transit'}</span>
                    </div>
                    <div class="bg-card p-4 rounded-xl border border-custom mb-6">
                        <span class="text-xs text-gray-400 block mb-1">Location</span>
                        <span class="text-sm font-medium text-gray-300">${item.location || 'Updating...'}</span>
                    </div>
                </div>
            `;
        }

        function addShipment() {
            let nameInput = document.getElementById('addName').value.trim();
            let trackingRaw = document.getElementById('addTracking').value.trim();
            if (!trackingRaw) return alert('Enter a tracking number.');
            
            let lines = trackingRaw.split(/[\n,]+/).map(t => t.trim()).filter(t => t.length > 0);
            lines.forEach((tn, idx) => {
                let cleanTn = tn.replace(/\s+/g, '');
                db.collection('shipments').add({
                    name: lines.length > 1 ? `${nameInput || 'Shipment'} #${idx + 1}` : (nameInput || 'Shipment'),
                    tracking: cleanTn,
                    status: 'In Transit',
                    location: 'Updating...',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            });

            toggleModal('addModal');
            document.getElementById('addName').value = '';
            document.getElementById('addTracking').value = '';
        }

        function deleteShipment(e, id) {
            e.stopPropagation();
            if (confirm("Delete this shipment?")) {
                db.collection('shipments').doc(id).delete();
            }
        }

        function toggleModal(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function filterShipments() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = shipments.filter(s => s.name.toLowerCase().includes(q) || (s.tracking || '').includes(q));
            renderList(filtered);
        }
    </script>
</body>
</html>
